<!DOCTYPE html>
<html>
<head>
    <title>Responsive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            width: 50%;
        }

        .first {
            background-color: lightgreen;
        }

        .second {
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first">
                First cell
            </td>

            <td class="second">
                Second cell
            </td>
        </tr>
    </table>

</body>
</html>
